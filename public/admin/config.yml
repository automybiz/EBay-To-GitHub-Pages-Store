# ---------------------------------------------------------------------------
# Sveltia CMS — inventory management for the EuroPartsWest storefront.
# Docs: https://sveltiacms.app/en/docs
#
# Everything in `public/` is copied verbatim into the build, so this UI is
# served at /admin/ on both `npm run dev` and the deployed site.
#
# STORAGE MODEL
#   * `src/data/ebay-products.json` — the eBay catalogue, generated by
#     `python ebay_sync.py`. Do not edit by hand.
#   * `src/content/products/*.md`  — direct/hand-managed inventory (this CMS).
# ---------------------------------------------------------------------------

backend:
  name: github
  repo: automybiz/Ebay-To-GitHub-Pages-Store
  branch: main
  # GitHub OAuth needs a small auth worker when the site is not hosted on Netlify.
  # This site is on a custom domain, so api.netlify.com rejects it with a
  # "Not Found" error. We self-host Sveltia CMS Authenticator on Cloudflare
  # Workers (https://github.com/sveltia/sveltia-cms-auth) and point the CMS at
  # it. The worker must allow this site's domain via its ALLOWED_DOMAINS var.
  base_url: https://epw-sveltia-cms.europartswest.workers.dev
  auth_endpoint: auth

# NOTE: there is deliberately no `local_backend` key here. Sveltia dropped the
# Decap/Netlify-CMS proxy-server workflow and ignores that option. To edit
# locally, open http://localhost:4321/admin/index.html in a Chromium browser
# (Chrome/Edge/Brave — Firefox isn't supported yet) and choose
# "Work with Local Repository", then pick this project folder.

# Uploaded images are written into Astro's `public/` dir and served from the
# site root.
media_folder: public/images/products
public_folder: /images/products

collections:
  - name: products
    label: Products
    label_singular: Product
    description: Direct inventory, shown alongside the eBay-synced catalogue.
    folder: src/content/products
    create: true
    delete: true
    slug: '{{fields.sku}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{sku}}'
    sortable_fields: [title, sku, price, stock]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: SKU, name: sku, widget: string, hint: Your internal part number. }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Primary Product Image, name: image, widget: image, required: false }
      - { label: Price, name: price, widget: number, value_type: float, min: 0 }
      - { label: Stock, name: stock, widget: number, value_type: int, min: 0, default: 0 }

      - label: Variants
        name: variants
        label_singular: Variant
        widget: list
        required: false
        hint: Per-option price and stock. Leave the list empty for a single-SKU product.
        summary: '{{fields.variant_option_name}} — {{fields.variant_sku}}'
        fields:
          - label: Variant Option Name
            name: variant_option_name
            widget: string
            hint: 'e.g. 14V / 75 AMP, Black, Left'
          - label: SKU
            name: variant_sku
            widget: string
          - label: Price
            name: variant_price
            widget: number
            value_type: float
            min: 0
          - label: Stock
            name: variant_stock
            widget: number
            value_type: int
            min: 0
            default: 0
          - label: Variant Image (Optional)
            name: variant_image
            widget: image
            required: false
            hint: Swapped into the main photo when this option is selected.
