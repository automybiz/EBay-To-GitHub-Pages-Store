<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Never index the admin UI. -->
    <meta name="robots" content="noindex" />
    <title>EuroPartsWest — Content Manager</title>

  </head>
  <body>
    <!--
      Sveltia CMS — a drop-in, Decap/Netlify-CMS compatible editor.
      Loaded from the CDN as an ES module; all configuration lives in the
      sibling config.yml file.
    -->
    <!-- Injects single Floating Guide Button -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (!document.getElementById('epw-guide-btn')) {
            const btn = document.createElement('a');
            btn.id = 'epw-guide-btn';
            btn.href = '/admin/guide.html';
            btn.target = '_blank';
            btn.innerHTML = '📖 System Guide &amp; Docs ↗';
            btn.style.cssText = 'position:fixed;bottom:25px;right:25px;z-index:999999;background:#c8102e;color:#fff;padding:12px 22px;border-radius:30px;font-family:sans-serif;font-weight:bold;font-size:13px;text-decoration:none;box-shadow:0 4px 20px rgba(0,0,0,0.8);display:flex;align-items:center;gap:8px;';
            document.body.appendChild(btn);
          }
        }, 800);
      });
    </script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
